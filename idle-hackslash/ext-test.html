<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>外部画像テスト</title>
<style>body{font-family:sans-serif;background:#1b1e29;color:#eef0f6;text-align:center;padding:24px}img{max-width:200px;max-height:200px;border:2px dashed #64e8ff;border-radius:12px}.r{font-size:1.2rem;font-weight:800;margin:10px 0 24px}</style></head>
<body><h2>外部サーバー画像の読み込みテスト</h2>
<div>① img タグで表示</div>
<img id="i" src="https://hisashiapp.xsrv.jp/HakusuraTap/ranking/Stage.png" alt="">
<div id="r1" class="r">確認中…</div>
<div>② ゲームと同じ方式（canvas に描画）</div>
<canvas id="c" width="160" height="160" style="border:2px dashed #ffd76b;border-radius:12px"></canvas>
<div id="r2" class="r">確認中…</div>
<script>
const i = document.getElementById('i'), r1 = document.getElementById('r1'), r2 = document.getElementById('r2');
i.onload = () => { r1.textContent = '✅ 表示できました'; r1.style.color = '#7ee787'; };
i.onerror = () => { r1.textContent = '❌ 読み込めませんでした'; r1.style.color = '#ff5c6c'; };
const im = new Image();
im.onload = () => { const c = document.getElementById('c').getContext('2d'); c.drawImage(im, 0, 0, 160, 160); r2.textContent = '✅ 描画できました'; r2.style.color = '#7ee787'; };
im.onerror = () => { r2.textContent = '❌ 描画できませんでした'; r2.style.color = '#ff5c6c'; };
im.src = 'https://hisashiapp.xsrv.jp/HakusuraTap/ranking/Stage.png';
</script></body></html>
